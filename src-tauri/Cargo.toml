[package]
name = "logline"
version = "1.0.0"
description = "Offline-first whiteboard"
authors = ["LogLine"]
edition = "2021"

[lib]
name = "logline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
base64 = "0.22"
nanoid = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.0.0", features = [] }
tokio = { version = "1.0", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
zip = "2.2.2"
